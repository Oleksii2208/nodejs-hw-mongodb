tags:
  - Auth
summary: Reset user password
operationId: resetPassword
description: Reset password using a token
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - token
          - newPassword
        properties:
          token:
            description: JWT token for password reset
            type: string
            example: 'token'
          newPassword:
            description: New password for user account
            type: string
            example: 123Qwerty
responses:
  '200':
    description: Password has been successfully reset.
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Password has been successfully reset.
            data:
              type: object
              example: {}
  '400':
    description: Invalid or expired token
