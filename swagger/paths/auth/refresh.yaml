tags:
  - Auth
summary: Refresh user session
operationId: refreshUser
description: Refresh access token using refresh token
security:
  - bearerAuth: []
responses:
  '200':
    description: Successfully refreshed a session!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully refreshed a session!
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  example: 'rcw4HSI4H/8SJab/KVe6qXposkZrz2UQXVTwaluW'
  '401':
    description: Unauthorized
