tags:
  - Auth
summary: Send password reset email
operationId: sendResetEmail
description: Send an email with instructions to reset password
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            description: User's email
            type: string
            format: email
            example: 'qwe@gmail.com'
responses:
  '200':
    description: Reset password email was successfully sent!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Reset password email was successfully sent!
            data:
              type: object
              example: {}
  '404':
    description: User not found
