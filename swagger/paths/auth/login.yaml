tags:
  - Auth
summary: Login a user
operationId: loginUser
description: Login an existing user
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            description: User's email
            type: string
            format: email
            example: 'qwe@gmail.com'
          password:
            description: User's password
            type: string
            example: 123Qwerty
responses:
  '200':
    description: Successfully logged in an user!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged in an user!
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  example: 'rcw4HSI4H/8SJab/KVe6qXposkZrz2UQXVTwaluW'
  '401':
    description: Unauthorized
