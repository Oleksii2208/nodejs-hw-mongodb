tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - isFavourite
          - contactType
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '+380500505555'
          email:
            description: "Contact's email"
            type: string
            example: 'qwe@gmail.com'
          isFavourite:
            description: 'Is the contact a favorite'
            type: boolean
            example: false
          contactType:
            description: 'What type of contact this contact is'
            type: string
            enum: ['work', 'home', 'personal']
          photo:
            description: "Contact's photo"
            type: string
            format: binary
            example: https://res.cloudinary.com/de6wm8ece/image/upload/v1751928514/jtpdi65mahhgaexrqxmj.jpg
responses:
  '201':
    description: 'Creates a contacts'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: '../../components/schemas/contact.yaml'
  '404':
    $ref: '../../components/responses/404.yaml'
