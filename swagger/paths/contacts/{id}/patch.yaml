tags:
  - Contacts
summary: Patch contact by id
operationId: patchContact
description: 'Fix one user contact by ID, if it already exists in the database of our application.'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '683e09e98e64d4b792a71f00'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - isFavourite
          - contactType
          - userId
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '+380500505555'
          email:
            description: "Contact's email"
            type: string
            example: 'qwe@gmail.com'
          isFavourite:
            description: 'Is the contact a favorite'
            type: boolean
            example: false
          contactType:
            description: 'What type of contact this contact is'
            type: string
            enum: ['work', 'home', 'personal']
          userId:
            description: "Contact's user id"
            type: string
            example: 68683d3e542a538a19ed648d
          photo:
            description: "Contact's photo"
            type: string
            example: binary

responses:
  '200':
    description: 'Patch contact by id'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
